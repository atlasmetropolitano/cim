<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor SIG Multimedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #191919; }
      #map { height: 100vh; }
    </style>
</head>
<body>
    <!-- Botón de carga de archivo -->
    <div id="file-drop" style="position:fixed;top:15px;left:50px;z-index:10000;">
      <label style="background:#232323;color:#fff;padding:8px 14px;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px #0007;font-weight:500;">
        📂 Cargar capa (Solamente GeoJSON)
        <input type="file" id="file-input" accept=".geojson" style="display:none;">
      </label>
    </div>

    <div id="map"></div>

    <!-- FAB mapas base -->
    <div id="baseMapFab" class="base-map-fab" title="Cambiar mapa base">🗺️</div>
    <div id="baseMapOptions" class="base-map-options" style="display:none;">
      <button data-layer="osm">🌐 OSM</button>
      <button data-layer="gmap">🗺️ Google Maps</button>
      <button data-layer="gsat">🛰️ Satélite</button>
    </div>

    <!-- MODALES MULTIMEDIA -->
    <div id="mediaModal" class="media-modal hidden"></div>
    <div id="overlay" class="overlay hidden"></div>


<button onclick="window.open('conversor/index.html', '_blank')" style="
  position:fixed;
  bottom:30px;
  right:30px;
  background:#20242c;
  color:#fff;
  border:none;
  border-radius:40px;
  padding:16px 28px;
  box-shadow:0 4px 16px #0006;
  font-size:18px;
  cursor:pointer;
  z-index:9999;">
  <i class="fa fa-exchange-alt"></i> Convertir SHP/ZIP a GeoJSON
</button>




<!-- Modal informativo al iniciar -->
<div id="geojson-warning" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;">
  <div style="
    background-color: #222831;
    color: #eeeeee;
    padding: 30px 40px;
    border-radius: 16px;
    max-width: 600px;
    text-align: center;
    font-family: sans-serif;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);">
    <h2 style="color: #ffd369;">⚠️ Atención</h2>
    <p style="font-size: 18px; margin: 20px 0;">
      Esta herramienta (por ahora) <strong>carga archivos GeoJSON</strong>.<br>
      Dentro de la página puede encontrar (abajo a la derecha) una herramienta on-line para <strong>transformar archivos SHP/ZIP a GeoJSON</strong>.
    </p>
    <p style="margin-bottom: 20px;">¡Gracias por usar el visor!</p>
    <button onclick="cerrarAdvertencia()" style="
      background-color: #ffd369;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;">
      Entendido
    </button>
  </div>
</div>

<!-- === SIMÓN INCOGNITO — disparador: escribir "Alejandro" rápido === -->
<script>
(function(){
  // ====== CONFIG ======
  const SIMON_SRC = "simon/index.html"; // Ruta a tu juego
  const Z = 999999;                       // z-index del modal
  const SECRET_WORD = "alejandro";        // palabra clave (sin acentos)
  const MAX_GAP_MS = 600;                 // tiempo máx entre teclas (↓ = más estricto)

  // ====== ESTILOS del modal (aislados por prefijo .simon-ee) ======
  const css = `
  .simon-ee-dialog{ border:none; padding:0; background:transparent; }
  .simon-ee-backdrop::backdrop{ background: rgba(0,0,0,.55); }
  .simon-ee-wrap{
    position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,.55); z-index:${Z};
  }
  .simon-ee-card{
    width:min(1000px, 92vw); height:min(760px, 92vh);
    background:#0f1220; border:1px solid rgba(255,255,255,.15);
    border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.5); position:relative; overflow:hidden;
  }
  .simon-ee-head{ display:flex; align-items:center; justify-content:space-between;
    padding:.5rem .75rem; border-bottom:1px solid rgba(255,255,255,.12); color:#e7e9f1; background:#12162b;}
  .simon-ee-title{ margin:0; font-size:1rem; letter-spacing:.3px;}
  .simon-ee-close{
    background:transparent; border:none; color:#e7e9f1; cursor:pointer; font-size:1.25rem;
    width:36px; height:36px; border-radius:8px;
  }
  .simon-ee-close:focus-visible{ outline:3px solid #ffd166; outline-offset:2px; }
  .simon-ee-frame{ width:100%; height:calc(100% - 48px); border:0; display:block; background:#000; }`;

  // Inyectar estilos
  const style = document.createElement("style");
  style.setAttribute("data-simon-ee","1");
  style.textContent = css;
  document.head.appendChild(style);

  // Crear modal (usa <dialog> si existe, si no un DIV)
  const supportsDialog = "HTMLDialogElement" in window;
  let portal, frame, previouslyFocused;

  function buildPortal(){
    if (portal) return;
    if (supportsDialog){
      portal = document.createElement("dialog");
      portal.className = "simon-ee-dialog simon-ee-backdrop";
      portal.innerHTML = `
        <div class="simon-ee-card" role="document" aria-label="Juego secreto Simón">
          <div class="simon-ee-head">
            <h3 class="simon-ee-title">Simón — Modo Incógnito</h3>
            <button class="simon-ee-close" aria-label="Cerrar (Esc)">&times;</button>
          </div>
          <iframe class="simon-ee-frame" title="Simón (iframe)" loading="lazy"></iframe>
        </div>`;
      document.body.appendChild(portal);
    } else {
      portal = document.createElement("div");
      portal.className = "simon-ee-wrap";
      portal.style.display = "none";
      portal.innerHTML = `
        <div class="simon-ee-card" role="dialog" aria-modal="true" aria-label="Juego secreto Simón">
          <div class="simon-ee-head">
            <h3 class="simon-ee-title">Simón — Modo Incógnito</h3>
            <button class="simon-ee-close" aria-label="Cerrar (Esc)">&times;</button>
          </div>
          <iframe class="simon-ee-frame" title="Simón (iframe)" loading="lazy"></iframe>
        </div>`;
      document.body.appendChild(portal);
    }
    frame = portal.querySelector("iframe");
    portal.querySelector(".simon-ee-close").addEventListener("click", closeSimon);
    if (!supportsDialog){
      portal.addEventListener("click", (e)=>{ if (e.target===portal) closeSimon(); });
      document.addEventListener("keydown", (e)=>{ if (e.key==="Escape") closeSimon(); });
    }
  }

  function openSimon(){
    buildPortal();
    previouslyFocused = document.activeElement;
    if (!frame.getAttribute("src")) frame.setAttribute("src", SIMON_SRC); // carga perezosa
    if (supportsDialog){ portal.showModal(); } else { portal.style.display = "flex"; }
    portal.querySelector(".simon-ee-close").focus({preventScroll:true});
  }

  function closeSimon(){
    if (!portal) return;
    if (supportsDialog) portal.close(); else portal.style.display = "none";
    previouslyFocused?.focus?.({preventScroll:true});
  }

  // ====== Disparador: escribir "Alejandro" rápido ======
  // Normaliza letras (quita acentos) y compara en minúsculas
  const target = SECRET_WORD.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  let pos = 0;
  let lastTs = 0;

  window.addEventListener("keydown", (e)=>{
    // Evitar activar mientras se escribe en inputs/áreas editables
    const t = e.target;
    const tag = (t && t.tagName) ? t.tagName.toLowerCase() : "";
    if (tag==="input" || tag==="textarea" || t?.isContentEditable) return;

    let k = e.key;
    if (k === "Dead") return;                 // teclas muertas de acentos
    if (k.length !== 1) return;               // solo caracteres (ignora Shift, Alt, etc.)
    k = k.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

    const now = Date.now();
    if (now - lastTs > MAX_GAP_MS) { pos = 0; }  // si tardó mucho, reinicia
    lastTs = now;

    // ¿coincide con el siguiente carácter?
    if (k === target[pos]) {
      pos++;
      if (pos === target.length) {
        pos = 0;
        openSimon();
      }
      return;
    }

    // Si no coincide, probar si reiniciando en 1 (por si empieza de nuevo con 'a')
    pos = (k === target[0]) ? 1 : 0;
  }, {capture:false});

  // Exponer una API mínima por si querés abrirlo desde otro botón:
  window.SimonIncognito = { open: openSimon, close: closeSimon };
})();
</script>
<!-- ================================================================= -->
